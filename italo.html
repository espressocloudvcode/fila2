<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página personal de Italo Iparraguirre Ramos">
  <title>Italo Iparraguirre Ramos | Mi página</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg, #f9a8d4, #c084fc, #818cf8);
    }
    main {
      width: min(100%, 600px); padding: 48px 30px; text-align: center;
      border: 1px solid rgba(255,255,255,.2); border-radius: 24px;
      background: #18181b; box-shadow: 0 20px 55px rgba(0,0,0,.25);
    }
    .avatar {
      width: 94px; height: 94px; margin: 0 auto 22px; display: grid;
      place-items: center; border-radius: 50%; color: #18181b;
      background: #f9a8d4; font-size: 32px; font-weight: 800;
    }
    h1 { margin: 0 0 14px; color: #f9a8d4; font-size: clamp(27px, 5vw, 38px); }
    p { color: #d4d4d8; line-height: 1.7; }
    .tag {
      display: inline-block; margin-top: 18px; padding: 10px 18px;
      border-radius: 999px; color: #18181b; background: #f9a8d4; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">II</div>
    <h1>Italo Iparraguirre Ramos</h1>
    <p>¡Hola! Bienvenido a mi página personal.</p>
    <p>Estudiante de SENATI y apasionado por aprender desarrollo web.</p>
    <span class="tag">Mi presentación personal</span>
  </main>
</body>
</html>
