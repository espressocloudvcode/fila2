<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5636a8">
  <title>Valery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #15152f, #5636a8, #e0529b);
    }
    .tarjeta {
      width: min(100%, 620px);
      text-align: center;
      padding: clamp(36px, 8vw, 55px) clamp(24px, 7vw, 70px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px;
      background: rgba(255,255,255,.12);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: 5px;
    }
    p {
      margin: 16px 0 0;
      font-size: 1.1rem;
      opacity: .9;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Valery</h1>
    <p>¡Bienvenida a mi página!</p>
  </main>
</body>
</html>
