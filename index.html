<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Keniber Kenn Diaz Lagos | Mi página</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #f8fafc; background:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,.25), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(139,92,246,.25), transparent 32%),
        #0f172a;
    }
    main {
      width: min(100%, 680px); padding: clamp(28px, 6vw, 58px);
      text-align: center; border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px; background: rgba(255,255,255,.07);
      box-shadow: 0 25px 80px rgba(0,0,0,.35); backdrop-filter: blur(14px);
    }
    .avatar {
      width: 92px; height: 92px; margin: 0 auto 24px; display: grid;
      place-items: center; border-radius: 50%; font-size: 38px;
      font-weight: 800; color: white; background: linear-gradient(135deg,#2563eb,#8b5cf6);
      box-shadow: 0 12px 35px rgba(59,130,246,.3);
    }
    .eyebrow { color: #93c5fd; text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 700; }
    h1 { margin: 14px 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.12; }
    p { margin: 0 auto; max-width: 500px; color: #cbd5e1; font-size: 17px; line-height: 1.7; }
    .tag { display: inline-block; margin-top: 28px; padding: 10px 16px; border-radius: 999px;
      border: 1px solid rgba(147,197,253,.35); color: #bfdbfe; font-size: 13px; }
    footer { margin-top: 38px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">K</div>
    <div class="eyebrow">Mi página personal</div>
    <h1>Keniber Kenn Diaz Lagos</h1>
    <p>¡Hola! Bienvenido a mi espacio en la web. Esta página es mi presentación personal y el comienzo de nuevos proyectos.</p>
    <span class="tag">GitHub · Kenn-162</span>
    <footer>Hecho con dedicación ♥</footer>
  </main>
</body>
</html>
